<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стилист — демо</title>
<style>
  :root { --bg:#faf9f6; --card:#fff; --ink:#22201d; --muted:#8a857d; --line:#e5e2dc; --accent:#0f6b5c; }
  * { box-sizing:border-box; margin:0; }
  body { font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink);
         max-width:680px; margin:0 auto; padding:24px 16px 120px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .sub b { color:var(--accent); }
  #chat { display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .look { align-self:stretch; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .look h3 { font-size:14px; margin-bottom:8px; }
  .item { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-top:1px dashed var(--line); font-size:14px; }
  .item:first-of-type { border-top:none; }
  .item .meta { color:var(--muted); font-size:12px; }
  .price { white-space:nowrap; font-weight:600; }
  .fb { display:flex; gap:8px; margin-top:10px; }
  .fb button { flex:1; padding:8px; border:1px solid var(--line); background:var(--bg); border-radius:8px; cursor:pointer; font-size:14px; }
  .fb button:hover { border-color:var(--accent); }
  .fb button:disabled { opacity:.5; cursor:default; }
  #bar { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); }
  #bar .inner { max-width:680px; margin:0 auto; padding:12px 16px; display:flex; gap:8px; }
  #q { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  button.primary { padding:10px 16px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button.primary:disabled { opacity:.5; }
  #build { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
  <h1>👗 Стилист — демо</h1>
  <div class="sub">Тонкий веб-клиент того же backend-API, что и Telegram-бот · статус: <b id="health">…</b></div>
  <div id="chat"></div>

  <div id="bar"><div class="inner">
    <input id="q" placeholder="Например: «Собери образ в офис до 15000» или вопрос по стилю"
           onkeydown="if(event.key==='Enter')send()">
    <button class="primary" id="build" onclick="build()">✨ Образ</button>
    <button class="primary" id="go" onclick="send()">➤</button>
  </div></div>

<script>
const chat = document.getElementById('chat');
const q = document.getElementById('q');
let lastItems = [];

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  chat.appendChild(d); d.scrollIntoView({behavior:'smooth'});
  return d;
}

function addLook(look) {
  const d = document.createElement('div');
  d.className = 'look';
  d.innerHTML = '<h3>Готовый образ · ' +
    look.items.reduce((s,i)=>s+i.price,0).toLocaleString('ru') + '₽</h3>' +
    look.items.map(i =>
      `<div class="item"><div>${i.title}<div class="meta">${i.category} · ${i.brand} · ${i.store}</div></div>` +
      `<div class="price">${i.price.toLocaleString('ru')}₽</div></div>`).join('') +
    `<div class="fb">
       <button onclick="fb(this,'like')">👍 Нравится</button>
       <button onclick="fb(this,'dislike')">👎 Не то</button>
       <button onclick="fb(this,'buy')">🛒 Куплю</button></div>` +
    `<div class="hint">${look.rationale || ''}</div>`;
  chat.appendChild(d); d.scrollIntoView({behavior:'smooth'});
}

async function post(path, body) {
  const r = await fetch(path, {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function ask(text, intent) {
  add('user', text);
  const wait = add('bot', '…');
  document.querySelectorAll('#bar button').forEach(b=>b.disabled=true);
  try {
    const data = await post('/message', intent ? {text, intent} : {text});
    wait.remove();
    if (data.final_looks && data.final_looks.length) {
      lastItems = data.final_looks[0].items.map(i=>i.id);
      addLook(data.final_looks[0]);
    } else {
      add('bot', data.answer || '…');
    }
  } catch(e) { wait.textContent = 'Сервис недоступен: ' + e; }
  document.querySelectorAll('#bar button').forEach(b=>b.disabled=false);
}

function send() { const t = q.value.trim(); if (t) { q.value=''; ask(t); } }
function build() { ask(q.value.trim() || 'Собери образ', 'new_look'); q.value=''; }

async function fb(btn, signal) {
  btn.closest('.fb').querySelectorAll('button').forEach(b=>b.disabled=true);
  try {
    await Promise.all(lastItems.map(id => post('/feedback', {item_id:id, signal})));
    btn.textContent += ' ✓';
  } catch(e) { btn.textContent = 'ошибка'; }
}

fetch('/health').then(r=>r.json())
  .then(h => document.getElementById('health').textContent = `ok · каталог ${h.catalog_items} поз.`)
  .catch(()=> document.getElementById('health').textContent = 'API недоступен');

add('bot', 'Привет! Я бот-стилист. Напишите повод и бюджет («образ в офис до 15000») и нажмите «✨ Образ», или задайте вопрос по стилю.');
</script>
</body>
</html>
